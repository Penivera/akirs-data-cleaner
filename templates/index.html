<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Cleaner Bot</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1><span class="gradient-text">AKIRS</span> Batch Cleaner</h1>
            <p>Upload your retail migration workbooks for magic auto-mapping and processing.</p>
        </header>

        <nav class="top-nav">
            <a href="#" class="nav-item active" 
               hx-get="/api/view/process" 
               hx-target="#main-content"
               onclick="document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); this.classList.add('active');">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                Batch Process
            </a>
            <a href="#" class="nav-item" 
               hx-get="/api/view/cleaned" 
               hx-target="#main-content"
               onclick="document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); this.classList.add('active');">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Cleaned Data
            </a>
        </nav>

        <main id="main-content">
            {% include 'partials/process_view.html' %}
        </main>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
