{% import 'partials/icons.html' as icons %}
<form hx-post="/api/nuban/save-config/{{ file.id }}" hx-target="#nuban-file-{{ file.id }}" hx-swap="outerHTML" class="mapping-form">
    <div class="mapping-grid">
        <div class="mapping-row">
            <label for="bank-{{ file.id }}">Select bank</label>
            <select id="bank-{{ file.id }}" name="bank_code" class="fancy-select" required>
                {% if banks %}
                <option value="">-- Select bank --</option>
                {% for bank in banks %}
                <option value="{{ bank.code }}" {% if file.selected_bank_code == bank.code %}selected{% endif %}>{{ bank.name }}</option>
                {% endfor %}
                {% else %}
                <option value="">Error: could not load banks</option>
                {% endif %}
            </select>
        </div>
        <div class="mapping-row">
            <label for="nuban-col-{{ file.id }}">NUBAN column</label>
            <select id="nuban-col-{{ file.id }}" name="nuban_col" class="fancy-select" required>
                <option value="">-- Select NUBAN column --</option>
                {% for header in file.headers %}
                <option value="{{ header }}" {% if file.mapped_nuban_col == header %}selected{% endif %}>{{ header }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mapping-row">
            <label for="target-col-{{ file.id }}">Target column (for names)</label>
            <input type="text" id="target-col-{{ file.id }}" name="target_col" class="fancy-select" placeholder="e.g. RESOLVED_NAME" value="{{ file.mapped_target_col or 'ACCOUNT_NAME_RESOLVED' }}" required>
        </div>
    </div>

    {% if preview_rows %}
    <div style="margin-top: 1.5rem;">
        <label class="mapping-section-label" style="margin-bottom: 0.5rem;">Data preview (first {{ preview_rows|length }} rows)</label>
        <div class="table-container" style="margin: 0;">
            <table class="fancy-table">
                <thead>
                    <tr>
                        {% for header in file.headers %}
                        <th>{{ header }}</th>
                        {% endfor %}
                    </tr>
                </thead>
                <tbody>
                    {% for row in preview_rows %}
                    <tr>
                        {% for cell in row %}
                        <td>{{ cell }}</td>
                        {% endfor %}
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    {% endif %}

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">{{ icons.icon('save') }} Save configuration</button>
    </div>
</form>
