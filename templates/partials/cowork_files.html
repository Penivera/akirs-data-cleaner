<div id="cowork-files-container">
    {% if files %}
    <form id="cowork-bulk-form"
          hx-post="/api/cowork/spaces/{{ space.id }}/process"
          hx-target="#cowork-files-container">
        <!-- Toolbar for bulk processing -->
        <div style="background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; font-weight: 600; color: #334155; cursor: pointer; user-select: none;">
                    <input type="checkbox" id="select-all-cowork-files" style="transform: scale(1.2); accent-color: var(--primary);"
                           onchange="document.querySelectorAll('.cowork-file-select:not([disabled])').forEach(cb => cb.checked = this.checked);">
                    Select All Files ({{ files | length }})
                </label>
            </div>

            <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
                <label style="display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: #475569; cursor: pointer;">
                    <input type="checkbox" name="email_notify" value="true" style="accent-color: var(--primary);">
                    Email me when done
                </label>

                <button type="submit" class="btn btn-primary" style="display: flex; align-items: center; gap: 0.5rem;">
                    ⚡ Clean Selected Files via Celery
                </button>
            </div>
        </div>

        <!-- Files list -->
        <div class="file-list">
            {% for file in files %}
            {% set space_id = space.id %}
            {% include 'partials/cowork_file_card.html' %}
            {% endfor %}
        </div>
    </form>
    {% else %}
    <div style="background: white; border: 1px dashed #cbd5e1; border-radius: 0.75rem; text-align: center; padding: 3rem 1.5rem; color: #64748b;">
        <svg width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="margin: 0 auto 0.75rem; display: block; color: #94a3b8;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
        </svg>
        <p style="font-weight: 600; color: #334155;">No files uploaded in this space yet.</p>
        <p style="font-size: 0.85rem; margin-top: 0.25rem;">Use the upload zone above to add datasets in bulk and specify retention duration.</p>
    </div>
    {% endif %}
</div>
