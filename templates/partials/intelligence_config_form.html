{% import 'partials/icons.html' as icons %}
<form class="mapping-form" hx-post="/api/intel/save-config/{{ file.id }}" hx-target="#intel-file-{{ file.id }}" hx-swap="outerHTML">
    <h3 class="text-warning" style="border-bottom-color: var(--accent-border);">Configure target worksheet</h3>

    <div class="mapping-grid">
        <div class="mapping-row">
            <label for="sheet-{{ file.id }}">Select sheet to ingest</label>
            <select id="sheet-{{ file.id }}" name="selected_sheets" class="fancy-select" required>
                {% for sheet in file.sheet_names %}
                <option value="{{ sheet }}">{{ sheet }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mapping-row">
            <label class="mini-label" for="query-field-{{ file.id }}">Search query mapped field</label>
            <select id="query-field-{{ file.id }}" name="verify_db_query_field" class="fancy-select">
                <option value="" {% if not file.verify_db_query_field %}selected{% endif %}>Auto-detect (name/email/phone)</option>
                {% for target in targets %}
                <option value="{{ target }}" {% if file.verify_db_query_field == target %}selected{% endif %}>Query by {{ target }}</option>
                {% endfor %}
            </select>
            <small>Which field in the file to use as the lookup parameter against the live database.</small>
        </div>

        <div class="mapping-row">
            <label class="mini-label" for="target-col-{{ file.id }}">Prod DB target column</label>
            <select id="target-col-{{ file.id }}" name="verify_db_target_column" class="fancy-select">
                <option value="ANY" {% if file.verify_db_target_column == 'ANY' %}selected{% endif %}>Any column (name, email, or phone)</option>
                <option value="NAME" {% if file.verify_db_target_column == 'NAME' %}selected{% endif %}>Taxpayer name</option>
                <option value="EMAIL" {% if file.verify_db_target_column == 'EMAIL' %}selected{% endif %}>Email address</option>
                <option value="PHONE" {% if file.verify_db_target_column == 'PHONE' %}selected{% endif %}>Phone number</option>
            </select>
            <small>Which field in the live database to evaluate the query against.</small>
        </div>

        <div class="mapping-row">
            <label class="check-inline" for="fuzzy-{{ file.id }}">
                <input type="checkbox" id="fuzzy-{{ file.id }}" name="verify_db_fuzzy" value="true" {% if file.verify_db_fuzzy %}checked{% endif %}>
                <span style="font-size: 0.85rem; font-weight: 600;">Enable fuzzy Jaccard suggestions</span>
            </label>
            <small>Suggest duplicates when token-based word similarity is high.</small>
        </div>
    </div>

    <div class="form-actions">
        <button type="button" class="btn btn-outline" onclick="this.form.remove()">Cancel</button>
        <button type="submit" class="btn btn-accent">{{ icons.icon('database') }} Run deduplication audit</button>
    </div>
</form>
