<div class="file-card" id="file-{{ file.id }}">
    <div class="file-header">
        <div class="file-info">
            <span class="file-name">{{ file.original_filename }}</span>
            <span class="file-status status-{{ file.status | lower | replace(' ', '-') }}">{{ file.status }}</span>
        </div>
        <div class="file-actions">
            {% if 'Processed' in file.status %}
                <button class="btn btn-success" hx-get="/api/view/{{ file.id }}" hx-target="#data-view-{{ file.id }}">View Data</button>
                <a href="/api/download/{{ file.original_filename | replace('.xlsx', '.csv') }}" class="btn btn-primary" style="text-decoration: none;">Download</a>
            {% elif file.status == 'Ready' %}
                <button class="btn btn-warning" hx-post="/api/components/mapping/{{ file.id }}" hx-target="#mapping-area-{{ file.id }}">Options</button>
                <button class="btn btn-primary" hx-post="/api/process/{{ file.id }}" hx-target="#file-{{ file.id }}" hx-swap="outerHTML">Process</button>
            {% elif 'Needs Mapping' in file.status or 'Needs Sheet' in file.status %}
                <button class="btn btn-warning" hx-post="/api/components/mapping/{{ file.id }}" hx-target="#mapping-area-{{ file.id }}">Configure</button>
            {% endif %}
            <button class="btn btn-danger" hx-delete="/api/delete/{{ file.id }}" hx-target="#file-{{ file.id }}" hx-swap="outerHTML">X</button>
        </div>
    </div>
    
    <div id="mapping-area-{{ file.id }}" class="mapping-area">
        {# Dynamic mapping form will be injected here via HTMX #}
    </div>
    <div id="data-view-{{ file.id }}" class="data-view-area"></div>
</div>
