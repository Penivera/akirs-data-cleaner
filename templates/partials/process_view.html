<section class="upload-zone" id="upload-zone">
    <form id="upload-form" hx-post="/api/upload" hx-target="#file-list" hx-swap="afterbegin"
        hx-trigger="change from:#fileElem" enctype="multipart/form-data">
        <div class="drop-area">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <h3>Upload Datasets for Ingestion</h3>
            <p style="margin-bottom: 1.5rem;">Click or drag and drop Excel (.xlsx, .xls) or CSV files here to initiate
                health auditing and mapping</p>
            <label for="fileElem" class="btn btn-primary upload-pick-btn">Browse Local Files</label>
            <input type="file" id="fileElem" name="file" multiple accept=".xlsx, .xls, .csv" style="display: none;">
        </div>
    </form>
</section>

<section class="file-list-container" style="margin-top: 2.5rem;">
    <h2
        style="font-family: var(--font-heading); font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-bottom: 1.25rem;">
        Active Queue</h2>
    <div id="file-list" class="file-list">
        {% for file in files %}
        {% include 'partials/file_card.html' %}
        {% endfor %}
    </div>
</section>
