<div class="upload-status" id="{{ upload_status_id }}" hidden>
    <div class="upload-status__row">
        <span class="spinner" aria-hidden="true"></span>
        <span class="upload-status__msg" data-role="msg">Uploading file…</span>
        <span class="upload-status__pct" data-role="pct"></span>
    </div>
    <div class="progress" data-role="progress" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="progress__bar" data-role="bar"></span>
    </div>
</div>
