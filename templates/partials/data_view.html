<div class="table-container" style="margin-top: 1rem;">
    {% if rows and rows|length > 0 %}
    <table class="fancy-table">
        <thead>
            <tr>
                {% for header in rows[0] %}
                <th>{{ header }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in rows[1:] %}
            <tr>
                {% for cell in row %}
                <td>{{ cell }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <p class="table-note" style="padding: 0 0.9rem 0.75rem;">Showing the first 50 records.</p>
    {% else %}
    <p class="table-note" style="padding: 2rem; text-align: center;">No records available to display.</p>
    {% endif %}
</div>
