services:
  akirs:
    build: .
    image: akirs:latest
    container_name: akirs
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///app/data/akirs.db}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      START_CELERY_WORKER: "true"
    volumes:
      - uploads:/app/uploads
      - cleaned:/app/cleaned
      - data:/app/data

  celery:
    build: .
    image: akirs:latest
    container_name: akirs-celery
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///app/data/akirs.db}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=INFO", "-c", "2"]
    volumes:
      - uploads:/app/uploads
      - cleaned:/app/cleaned
      - data:/app/data

volumes:
  uploads:
  cleaned:
  data:
