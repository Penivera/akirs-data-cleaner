services:
  # Bundled broker so Celery does not depend on external Coolify networking.
  # The Coolify-provisioned Redis lives on a different Docker network and its
  # hostname is not resolvable here ("Temporary failure in name resolution").
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  akirs:
    build: .
    image: akirs:latest
    restart: unless-stopped
    # Coolify (Traefik) reaches this container over the internal Docker network,
    # so no host port is published here. Publishing "8080:8080" previously
    # collided with other workloads on the server:
    #   Bind for 0.0.0.0:8080 failed: port is already allocated
    # Assign a domain to this service in Coolify to expose it publicly.
    # (For a standalone run without Coolify, add:  ports: - "8080:8080")
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///app/data/akirs.db}
      # Hard-pinned to the bundled broker above; do not interpolate from the
      # Coolify env, which points at an unreachable external Redis host.
      REDIS_URL: redis://redis:6379/0
      START_CELERY_WORKER: "true"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - cleaned:/app/cleaned
      - data:/app/data

  celery:
    build: .
    image: akirs:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///app/data/akirs.db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=INFO", "-c", "2"]
    volumes:
      - uploads:/app/uploads
      - cleaned:/app/cleaned
      - data:/app/data

volumes:
  uploads:
  cleaned:
  data:
  redis-data:
