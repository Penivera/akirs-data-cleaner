services:
  # Bundled datastores so the stack does not depend on external Coolify
  # networking. The Coolify-provisioned Redis/Postgres live on different Docker
  # networks and their hostnames are not resolvable here
  # ("Temporary failure in name resolution").
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: akirs
      POSTGRES_PASSWORD: ${AKIRS_DB_PASSWORD:-akirs}
      POSTGRES_DB: akirs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akirs -d akirs"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  akirs:
    build: .
    image: akirs:latest
    restart: unless-stopped
    # Coolify (Traefik) reaches this container over the internal Docker network,
    # so no host port is published here. Publishing "8080:8080" previously
    # collided with other workloads on the server:
    #   Bind for 0.0.0.0:8080 failed: port is already allocated
    # Assign a domain to this service in Coolify to expose it publicly.
    # (For a standalone run without Coolify, add:  ports: - "8080:8080")
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: production
      # Hard-pinned to the bundled datastores; do not interpolate from the
      # Coolify env, which points at unreachable external hosts.
      DATABASE_URL: postgresql+asyncpg://akirs:${AKIRS_DB_PASSWORD:-akirs}@postgres:5432/akirs
      REDIS_URL: redis://redis:6379/0
      START_CELERY_WORKER: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - cleaned:/app/cleaned
      - data:/app/data

  celery:
    build: .
    image: akirs:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://akirs:${AKIRS_DB_PASSWORD:-akirs}@postgres:5432/akirs
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=INFO", "-c", "2"]
    volumes:
      - uploads:/app/uploads
      - cleaned:/app/cleaned
      - data:/app/data

volumes:
  uploads:
  cleaned:
  data:
  redis-data:
  postgres-data:
