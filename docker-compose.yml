services:
  # Datastores (Postgres + Redis) are Coolify-managed resources. This compose
  # only consumes their URLs, supplied via Coolify's env file. The app and
  # worker join the Coolify network so those hostnames resolve.
  akirs:
    build: .
    image: akirs:latest
    restart: unless-stopped
    # Coolify (Traefik) reaches this container over the Coolify network, so no
    # host port is published here (publishing 8080 collided with coolify-proxy).
    # Assign a domain to this service in Coolify to expose it publicly.
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: production
      # Supplied by Coolify (managed Postgres + Redis). Fail fast if missing
      # instead of silently falling back to SQLite / a local broker.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to the managed Postgres URL}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set to the managed Redis URL}
      # Dedicated `celery` service runs the worker; do not also start one here.
      START_CELERY_WORKER: "false"
    networks:
      - coolify
    volumes:
      - uploads:/app/uploads
      - cleaned:/app/cleaned
      - data:/app/data

  celery:
    build: .
    image: akirs:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to the managed Postgres URL}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set to the managed Redis URL}
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=INFO", "-c", "2"]
    networks:
      - coolify
    volumes:
      - uploads:/app/uploads
      - cleaned:/app/cleaned
      - data:/app/data

volumes:
  uploads:
  cleaned:
  data:

networks:
  # Shared Coolify network: lets the app resolve the managed Postgres/Redis/proxy.
  # Override the name with COOLIFY_NETWORK if your Coolify uses a different one.
  coolify:
    external: true
    name: ${COOLIFY_NETWORK:-coolify}
