services:
  # Bundled broker so Celery does not depend on external Coolify networking.
  # DATABASE_URL is supplied by Coolify's runtime env file (env_file: .env) and
  # points at the managed Postgres; the app/celery join the Coolify network so
  # that hostname resolves.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  akirs:
    build: .
    image: akirs:latest
    restart: unless-stopped
    # Coolify (Traefik) reaches this container over the Coolify network, so no
    # host port is published here (publishing 8080 collided with coolify-proxy).
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: production
      # Supplied by Coolify (the managed Postgres connection string). The
      # compose fails fast if it is missing rather than silently using SQLite.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to the managed Postgres URL}
      REDIS_URL: redis://redis:6379/0
      # The dedicated `celery` service runs the worker; do not also start one
      # inside the web container.
      START_CELERY_WORKER: "false"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - coolify
      - default
    volumes:
      - uploads:/app/uploads
      - cleaned:/app/cleaned
      - data:/app/data

  celery:
    build: .
    image: akirs:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to the managed Postgres URL}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=INFO", "-c", "2"]
    networks:
      - coolify
      - default
    volumes:
      - uploads:/app/uploads
      - cleaned:/app/cleaned
      - data:/app/data

volumes:
  uploads:
  cleaned:
  data:
  redis-data:

networks:
  # Shared Coolify network: lets the app resolve the managed Postgres/proxy.
  # Override the name with COOLIFY_NETWORK if your Coolify uses a different one.
  coolify:
    external: true
    name: ${COOLIFY_NETWORK:-coolify}
